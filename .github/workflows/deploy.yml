name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify JavaScript syntax & assets
        run: |
          node --check script.js documents.js server.js
          echo "JavaScript syntax check passed."

      - name: Verify critical files exist
        run: |
          test -f index.html    && echo "index.html OK"
          test -f documents.html && echo "documents.html OK"
          test -f 404.html      && echo "404.html OK"
          test -f styles.css    && echo "styles.css OK"
          test -f script.js     && echo "script.js OK"
          test -f documents.js  && echo "documents.js OK"
          test -f manifest.json && echo "manifest.json OK"
          test -f icon.svg      && echo "icon.svg OK"
          test -f favicon.ico   && echo "favicon.ico OK"
          test -f robots.txt    && echo "robots.txt OK"
          test -f sitemap.xml   && echo "sitemap.xml OK"
          echo "All required production assets verified."

      - name: Prepare production static distribution
        run: |
          mkdir -p _site
          cp index.html documents.html 404.html styles.css script.js documents.js manifest.json icon.svg favicon.ico robots.txt sitemap.xml .nojekyll _site/
          ls -la _site/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4