<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Avsar Logic Test Suite</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; padding: 24px; max-width: 720px; margin: 0 auto; line-height: 1.5; }
    h1 { font-size: 1.5rem; margin-bottom: 12px; }
    .test-pass { color: #2e7d32; font-weight: 600; margin: 4px 0; }
    .test-fail { color: #d32f2f; font-weight: 600; margin: 4px 0; }
    .summary { margin-top: 16px; padding: 12px; border-radius: 6px; background: #f5f5f5; font-family: monospace; }
  </style>
</head>
<body>
  <h1>Avsar Automated Verification Tests</h1>
  <div id="results">Running tests...</div>

  <script src="script.js"></script>
  <script>
    (function runTestSuite() {
      const container = document.getElementById("results");
      container.innerHTML = "";
      const results = [];

      function assert(desc, condition) {
        results.push({ desc, pass: !!condition });
      }

      // Test 1: Scholarships loaded
      assert("SCHOLARSHIPS array exists and contains entries", Array.isArray(SCHOLARSHIPS) && SCHOLARSHIPS.length >= 10);

      // Test 2: Required scholarship schema fields
      const hasValidFields = SCHOLARSHIPS.every(s => s.id && s.name && s.provider && s.type && Array.isArray(s.levels));
      assert("Every scholarship contains valid schema fields", hasValidFields);

      // Test 3: Urgency helper function exists
      assert("getUrgency function evaluates dates accurately", typeof getUrgency === "function");

      // Test 4: Escape HTML utility function
      assert("escapeHtml escapes dangerous characters", escapeHtml("<script>") === "&lt;script&gt;");

      // Test 5: Match computation returns valid results
      if (typeof computeMatches === "function") {
        const sampleMatches = computeMatches({
          level: "ug",
          category: "general",
          type: "merit",
          score: 85,
          income: 300000,
          gender: "any",
          state: "all"
        });
        assert("computeMatches returns array of matching scholarships", Array.isArray(sampleMatches));
      }

      // Render summary
      let passCount = 0;
      results.forEach(t => {
        const div = document.createElement("div");
        div.className = t.pass ? "test-pass" : "test-fail";
        div.textContent = `${t.pass ? "✓ PASS" : "✗ FAIL"}: ${t.desc}`;
        container.appendChild(div);
        if (t.pass) passCount++;
      });

      const summary = document.createElement("div");
      summary.className = "summary";
      summary.textContent = `Completed ${results.length} checks: ${passCount} passed, ${results.length - passCount} failed.`;
      container.appendChild(summary);
    })();
  </script>
</body>
</html>
