<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Avsar Logic Test Suite</title>
  <meta name="robots" content="noindex, nofollow">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; padding: 24px; max-width: 760px; margin: 0 auto; line-height: 1.5; color: #1f2937; }
    h1 { font-size: 1.5rem; margin-bottom: 8px; color: #111827; }
    p.subtitle { color: #6b7280; margin-bottom: 20px; font-size: 0.95rem; }
    .test-pass { color: #15803d; font-weight: 600; margin: 6px 0; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.9rem; }
    .test-fail { color: #b91c1c; font-weight: 600; margin: 6px 0; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.9rem; }
    .summary { margin-top: 24px; padding: 16px; border-radius: 8px; background: #f3f4f6; font-family: ui-monospace, monospace; border: 1px solid #e5e7eb; font-weight: 600; }
  </style>
</head>
<body>
  <h1>Avsar Automated Verification Tests</h1>
  <p class="subtitle">Client-side logic, dataset integrity, and conversational engine verification suite</p>
  <div id="results">Running verification suite...</div>

  <script src="script.js"></script>
  <script>
    (function runTestSuite() {
      const container = document.getElementById("results");
      container.innerHTML = "";
      const results = [];

      function assert(desc, condition) {
        results.push({ desc, pass: !!condition });
      }

      // Test 1: Scholarships loaded
      assert("SCHOLARSHIPS array exists and contains entries", Array.isArray(SCHOLARSHIPS) && SCHOLARSHIPS.length >= 10);

      // Test 2: Required scholarship schema fields
      const hasValidFields = SCHOLARSHIPS.every(s => s.id && s.name && s.provider && s.type && Array.isArray(s.levels));
      assert("Every scholarship contains valid schema fields", hasValidFields);

      // Test 3: Urgency helper function exists
      assert("getUrgency function evaluates dates accurately", typeof getUrgency === "function");

      // Test 4: Escape HTML utility function
      assert("escapeHtml escapes dangerous characters", escapeHtml("<script>") === "&lt;script&gt;");

      // Test 5: Match computation returns valid results
      if (typeof computeMatches === "function") {
        const sampleMatches = computeMatches({
          level: "ug",
          category: "general",
          type: "merit",
          score: 85,
          income: 300000,
          gender: "any",
          state: "all"
        });
        assert("computeMatches returns array of matching scholarships", Array.isArray(sampleMatches));
      }

      // Test 6: Scholarship IDs are unique without collisions
      const idSet = new Set();
      let hasDuplicates = false;
      SCHOLARSHIPS.forEach(s => {
        if (idSet.has(s.id)) hasDuplicates = true;
        idSet.add(s.id);
      });
      assert("Scholarship IDs are globally unique without duplicates", !hasDuplicates && idSet.size === SCHOLARSHIPS.length);

      // Test 7: Verify all amounts and deadlines are formatted strings
      const validAmountsAndDeadlines = SCHOLARSHIPS.every(s => typeof s.amount === "string" && s.amount.length > 0 && typeof s.deadline === "string" && s.deadline.length > 0);
      assert("All scholarships define non-empty amounts and deadlines", validAmountsAndDeadlines);

      // Test 8: Saathi companion response fallback
      if (typeof saathiReply === "function") {
        const reply = saathiReply("xyzunknownrandomquery123");
        assert("Saathi returns a helpful fallback response for unindexed queries", typeof reply === "string" && reply.length > 10);
      }

      // Test 9: Match engine resilience with boundary edge cases
      if (typeof computeMatches === "function") {
        const zeroScoreMatches = computeMatches({ level: "class10", category: "all", type: "any", score: 0, income: 0, gender: "any", state: "all" });
        assert("computeMatches gracefully evaluates zero income/score boundaries", Array.isArray(zeroScoreMatches));
      }

      // Test 10: Document prerequisites schema verification
      const validDocs = SCHOLARSHIPS.every(s => Array.isArray(s.documents) && s.documents.length > 0 && s.documents.every(d => typeof d === "string" && d.trim().length > 0));
      assert("All scholarships specify a structured list of required documents", validDocs);

      // Render summary
      let passCount = 0;
      results.forEach(t => {
        const div = document.createElement("div");
        div.className = t.pass ? "test-pass" : "test-fail";
        div.textContent = `${t.pass ? "✓ PASS" : "✗ FAIL"}: ${t.desc}`;
        container.appendChild(div);
        if (t.pass) passCount++;
      });

      const summary = document.createElement("div");
      summary.className = "summary";
      summary.textContent = `Completed ${results.length} checks: ${passCount} passed, ${results.length - passCount} failed.`;
      container.appendChild(summary);
    })();
  </script>
</body>
</html>
